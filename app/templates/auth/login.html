{% extends 'base.html' %}
{% block title %}Login - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-book-half text-warning display-4"></i>
                <h3 class="mt-2 fw-bold">Sign In to LMS</h3>
                <p class="text-muted">Select an account or enter your Roll / Employee ID</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Roll Number / Employee ID</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" name="roll_number" id="roll_number" class="form-control" placeholder="e.g. 25MCMC21, LIB01, ADMIN01" required autofocus>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </div>
            </form>

            <hr class="my-4">

            <!-- Quick Demo Login Switcher (super helpful for testing & viva presentation) -->
            <div class="bg-light p-3 rounded">
                <h6 class="text-secondary fw-bold mb-2"><i class="bi bi-lightning-charge-fill text-warning me-1"></i>Quick Switcher for Demo / Viva:</h6>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-sm btn-outline-danger" onclick="setRoll('ADMIN01')">
                        <i class="bi bi-shield-lock-fill"></i> Admin
                    </button>
                    <button class="btn btn-sm btn-outline-info" onclick="setRoll('LIB01')">
                        <i class="bi bi-person-workspace"></i> Librarian
                    </button>
                    <button class="btn btn-sm btn-outline-success" onclick="setRoll('25MCMC21')">
                        <i class="bi bi-mortarboard-fill"></i> Student (Daksh)
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="setRoll('FAC01')">
                        <i class="bi bi-person-video3"></i> Faculty
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function setRoll(val) {
    document.getElementById('roll_number').value = val;
}
</script>
{% endblock %}
